<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getFirestore,
  collection,
  doc,
  setDoc,
  deleteDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDr1J5UGwJfFNG0A5Ip3verQOXtnqA6i10",
  authDomain: "ecotermo-medidor.firebaseapp.com",
  projectId: "ecotermo-medidor",
  storageBucket: "ecotermo-medidor.firebasestorage.app",
  messagingSenderId: "863829552907",
  appId: "1:863829552907:web:d7489de48f0f047160bc0e",
  measurementId: "G-SQ145FV93F"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colRef = collection(db, "medidores");

let medidores = {};
let adminAutorizado = false;
let editandoClave = null;

const medidorEl = document.getElementById("medidor");
const minEl = document.getElementById("minutos");
const segEl = document.getElementById("segundos");

/* ===== SINCRONIZACIÓN ===== */

onSnapshot(colRef, (snapshot)=>{
  medidores = {};
  snapshot.forEach(docSnap=>{
    medidores[docSnap.id] = docSnap.data();
  });
  actualizarSelector();
  actualizarLista();
});

/* ===== UI ===== */

window.abrirPanel = function(){
  document.getElementById("panelAdmin").classList.add("activo");
  document.getElementById("overlay").classList.add("activo");
  actualizarLista();
}

window.cerrarPanel = function(){
  document.getElementById("panelAdmin").classList.remove("activo");
  document.getElementById("overlay").classList.remove("activo");
}

window.pedirPassword = function(){
  const pass = prompt("Ingrese contraseña:");
  if(pass === "final"){
    adminAutorizado = true;
    document.getElementById("zonaConfig").style.display = "block";
    actualizarLista();
  }
}

function actualizarSelector(){
  medidorEl.innerHTML="";
  Object.keys(medidores).forEach(key=>{
    const opt=document.createElement("option");
    opt.value=key;
    opt.textContent=medidores[key].nombre;
    medidorEl.appendChild(opt);
  });
}

function actualizarLista(){
  const cont=document.getElementById("listaMedidores");
  cont.innerHTML="";
  Object.keys(medidores).forEach(key=>{
    const med=medidores[key];
    const div=document.createElement("div");
    div.className="medItem";
    div.innerHTML=`
      <div>${med.nombre}</div>
      ${adminAutorizado ? `
        <div>
          <span class="iconoAccion" onclick="editarMedidor('${key}')">✏</span>
          <span class="iconoAccion" onclick="eliminarMedidor('${key}')">🗑</span>
        </div>
      ` : ""}
    `;
    cont.appendChild(div);
  });
}

window.mostrarFormulario = function(){
  editandoClave = null;
  document.getElementById("nuevoNombre").value = "";
  document.getElementById("nuevoInstrumento").value = "";
  document.getElementById("formMedidor").style.display="block";
}

window.editarMedidor = function(clave){
  const med = medidores[clave];
  editandoClave = clave;
  document.getElementById("nuevoNombre").value = med.nombre;
  document.getElementById("nuevoInstrumento").value = med.instrumento;
  document.getElementById("nuevaUnidad").value = med.unidad;
  document.getElementById("formMedidor").style.display="block";
}

/* ===== CRUD ===== */

window.guardarMedidor = async function(){

  const nombre=document.getElementById("nuevoNombre").value.trim();
  const instrumento=document.getElementById("nuevoInstrumento").value.trim();
  const unidad=document.getElementById("nuevaUnidad").value;

  if(!nombre) return;

  const clave = editandoClave || "med_"+Date.now();

  await setDoc(doc(db,"medidores",clave),{
    nombre,
    instrumento,
    unidad,
    tabla:[]
  });

  editandoClave = null;
  document.getElementById("formMedidor").style.display="none";
}

window.eliminarMedidor = async function(clave){
  await deleteDoc(doc(db,"medidores",clave));
}

/* ===== CÁLCULO ===== */

function calcular(){
  let min=Number(minEl.value)||0;
  let seg=Number(segEl.value)||0;

  if(seg>=60){
    min+=Math.floor(seg/60);
    seg%=60;
  }

  const total=(min*60)+seg;

  document.getElementById("totalSegundos").textContent=
    "Total: "+total+" segundos";

  if(total<=0) return;

  const dm3_h=(3600*100)/total;
  const m3_h=dm3_h/1000;

  document.getElementById("consumo_dm3").textContent=
    dm3_h.toFixed(2)+" dm³/h";

  document.getElementById("consumo_m3").textContent=
    m3_h.toFixed(4)+" m³/h";
}

minEl.addEventListener("input",calcular);
segEl.addEventListener("input",calcular);

</script>
