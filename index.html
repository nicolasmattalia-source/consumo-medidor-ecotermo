<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consumo de medidor</title>

<link rel="icon" href="ecotermo.png">

<style>
*{ box-sizing:border-box; }

body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
  padding:40px 20px;
  margin:0;
}

.menuBtn{
  position:absolute;
  top:20px;
  left:20px;
  background:none;
  border:none;
  color:white;
  font-size:28px;
  cursor:pointer;
  z-index:1100;
}

.container{
  background:#1e293b;
  padding:35px;
  border-radius:20px;
  max-width:750px;
  margin:0 auto;
  box-shadow:0 12px 35px rgba(0,0,0,0.5);
}

.logoBox{
  background:white;
  padding:12px 20px;
  border-radius:14px;
  display:inline-block;
  margin-bottom:20px;
}

.logoBox img{ width:180px; }

select, input, button{
  padding:8px;
  border-radius:8px;
  margin:6px;
}

.timeContainer{
  display:flex;
  justify-content:center;
  gap:20px;
  margin:20px 0;
}

.timeBox{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.result{
  margin-top:10px;
  font-size:20px;
  font-weight:bold;
}

.factor{
  margin-top:10px;
  font-size:18px;
  font-weight:bold;
}

.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:998;
}
.overlay.activo{ display:block; }

.panelAdmin{
  position:fixed;
  top:0;
  left:-320px;
  width:300px;
  height:100%;
  background:#111827;
  box-shadow:5px 0 20px rgba(0,0,0,0.5);
  transition:left 0.3s ease;
  z-index:999;
  padding:20px;
  overflow-y:auto;
}
.panelAdmin.activo{ left:0; }

.medItem{
  background:#1f2937;
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.iconoAccion{
  cursor:pointer;
}
</style>
</head>

<body>

<button class="menuBtn" onclick="abrirPanel()">☰</button>

<div class="container">

  <div class="logoBox">
    <img src="ecotermo.png">
  </div>

  <h1>Consumo de medidor</h1>

  <select id="medidor"></select>

  <p>Tiempo que tarda en consumir <b>100 dm³</b></p>

  <div class="timeContainer">
    <div class="timeBox">
      <label>Minutos</label>
      <input type="number" id="minutos" min="0">
    </div>
    <div class="timeBox">
      <label>Segundos</label>
      <input type="number" id="segundos" min="0">
    </div>
  </div>

  <div id="totalSegundos">Total: — segundos</div>

  <div class="result" id="consumo_dm3">— dm³/h</div>
  <div class="result" id="consumo_m3">— m³/h</div>
  <div class="factor" id="factor">Factor de corrección: —</div>

</div>

<div id="overlay" class="overlay" onclick="cerrarPanel()"></div>

<div id="panelAdmin" class="panelAdmin">

  <button onclick="pedirPassword()">⚙ Configuración</button>
  <hr>

  <div id="zonaConfig" style="display:none;">

    <button onclick="exportarDatos()">📤 Exportar</button>
    <button onclick="document.getElementById('importFile').click()">📥 Importar</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importarDatos(event)">

    <hr>

    <button onclick="mostrarFormulario()">➕ Agregar medidor</button>

    <div id="formMedidor" style="display:none;">
      <input type="text" id="nuevoNombre" placeholder="Nombre">
      <input type="text" id="nuevoInstrumento" placeholder="Instrumento">
      <select id="nuevaUnidad">
        <option value="dm3">dm³/h</option>
        <option value="m3">m³/h</option>
      </select>
      <input type="file" id="archivoTabla" accept=".csv">
      <button onclick="guardarMedidor()">Guardar</button>
    </div>

  </div>

  <hr>

  <div id="listaMedidores"></div>

  <br>
  <button onclick="cerrarPanel()">Cerrar</button>

</div>

<script>

let medidores = JSON.parse(localStorage.getItem("medidoresData")) || {};
let adminAutorizado = false;

const medidorEl = document.getElementById("medidor");
const minEl = document.getElementById("minutos");
const segEl = document.getElementById("segundos");

function abrirPanel(){
  document.getElementById("panelAdmin").classList.add("activo");
  document.getElementById("overlay").classList.add("activo");
  actualizarLista();
}

function cerrarPanel(){
  document.getElementById("panelAdmin").classList.remove("activo");
  document.getElementById("overlay").classList.remove("activo");
}

function pedirPassword(){
  const pass = prompt("Ingrese contraseña:");
  if(pass === "final"){
    adminAutorizado = true;
    document.getElementById("zonaConfig").style.display = "block";
    actualizarLista();
  }
}

function actualizarSelector(){
  medidorEl.innerHTML="";
  Object.keys(medidores).forEach(key=>{
    const opt=document.createElement("option");
    opt.value=key;
    opt.textContent=medidores[key].nombre;
    medidorEl.appendChild(opt);
  });
}

function actualizarLista(){
  const cont=document.getElementById("listaMedidores");
  cont.innerHTML="";
  Object.keys(medidores).forEach(key=>{
    const med=medidores[key];
    const div=document.createElement("div");
    div.className="medItem";
    div.innerHTML=`
      <div>${med.nombre}</div>
      ${adminAutorizado ? `<div class="iconoAccion" onclick="eliminarMedidor('${key}')">🗑</div>` : ""}
    `;
    cont.appendChild(div);
  });
}

function mostrarFormulario(){
  document.getElementById("formMedidor").style.display="block";
}

function guardarMedidor(){
  const nombre=document.getElementById("nuevoNombre").value.trim();
  const instrumento=document.getElementById("nuevoInstrumento").value.trim();
  const unidad=document.getElementById("nuevaUnidad").value;

  if(!nombre) return;

  const clave="med_"+Date.now();

  medidores[clave]={ nombre, instrumento, unidad, tabla:[] };

  localStorage.setItem("medidoresData", JSON.stringify(medidores));
  actualizarSelector();
  actualizarLista();
}

function eliminarMedidor(clave){
  delete medidores[clave];
  localStorage.setItem("medidoresData", JSON.stringify(medidores));
  actualizarSelector();
  actualizarLista();
}

function exportarDatos(){
  const blob=new Blob([JSON.stringify(medidores,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="backup_medidores.json";
  a.click();
}

function importarDatos(event){
  const reader=new FileReader();
  reader.onload=function(e){
    medidores=JSON.parse(e.target.result);
    localStorage.setItem("medidoresData", JSON.stringify(medidores));
    actualizarSelector();
    actualizarLista();
  };
  reader.readAsText(event.target.files[0]);
}

function calcular(){
  let min=Number(minEl.value)||0;
  let seg=Number(segEl.value)||0;

  if(seg>=60){
    min+=Math.floor(seg/60);
    seg%=60;
  }

  const total=(min*60)+seg;

  document.getElementById("totalSegundos").textContent=
    "Total: "+total+" segundos";

  if(total<=0) return;

  const dm3_h=(3600*100)/total;
  const m3_h=dm3_h/1000;

  document.getElementById("consumo_dm3").textContent=
    dm3_h.toFixed(2)+" dm³/h";

  document.getElementById("consumo_m3").textContent=
    m3_h.toFixed(4)+" m³/h";
}

minEl.addEventListener("input",calcular);
segEl.addEventListener("input",calcular);

actualizarSelector();

</script>

</body>
</html>
