<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consumo de medidor</title>

<style>
body{
  font-family: Arial;
  background:#1e293b;
  color:white;
  text-align:center;
  margin:0;
  padding:40px 20px;
}

.menuBtn{
  position:absolute;
  top:20px;
  left:20px;
  background:none;
  border:none;
  color:white;
  font-size:28px;
  cursor:pointer;
}

.container{
  background:#243247;
  padding:30px;
  border-radius:20px;
  max-width:700px;
  margin:auto;
}

.timeContainer{
  display:flex;
  margin-top:20px;
  background:#0f172a;
  border-radius:12px;
}

.timeBox{
  flex:1;
  padding:20px;
}

.timeBox input{
  width:80%;
  padding:8px;
  border-radius:8px;
}

.divider{
  width:2px;
  background:rgba(255,255,255,0.2);
}

.totalSeg{
  margin-top:15px;
  opacity:.8;
}

.result{
  margin-top:10px;
  font-size:20px;
}

.panelAdmin{
  position:fixed;
  top:0;
  left:-400px;
  width:350px;
  height:100%;
  background:#111827;
  padding:20px;
  transition:0.3s;
  overflow:auto;
}

.panelAdmin.activo{
  left:0;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
}

.overlay.activo{
  display:block;
}

/* Responsive */
@media(max-width:600px){
  .timeContainer{
    flex-direction:column;
  }
  .divider{
    height:2px;
    width:100%;
  }
  .panelAdmin{
    width:100%;
    left:-100%;
  }
}
</style>
</head>

<body>

<button class="menuBtn" onclick="abrirPanel()">☰</button>

<div class="container">

<h1>Consumo de medidor</h1>

<select id="medidor"></select>

<div class="timeContainer">
  <div class="timeBox">
    Minutos<br>
    <input type="number" id="minutos">
  </div>
  <div class="divider"></div>
  <div class="timeBox">
    Segundos<br>
    <input type="number" id="segundos">
  </div>
</div>

<div class="totalSeg" id="totalSegundos">Total: — segundos</div>

<div class="result" id="consumo_dm3">— dm³/h</div>
<div class="result" id="consumo_m3">— m³/h</div>

</div>

<div id="overlay" class="overlay" onclick="cerrarPanel()"></div>

<div id="panelAdmin" class="panelAdmin">

<h3>Administrar medidores</h3>

<button onclick="agregarMedidorDemo()">Agregar demo</button>
<button onclick="exportarBackup()">Exportar Backup</button>
<button onclick="importarBackup()">Importar Backup</button>

<input type="file" id="archivoBackup" accept=".json" style="display:none">

</div>

<script>

let medidores = JSON.parse(localStorage.getItem("medidoresData")) || {};

const medidorEl = document.getElementById("medidor");
const minEl = document.getElementById("minutos");
const segEl = document.getElementById("segundos");

function abrirPanel(){
  document.getElementById("panelAdmin").classList.add("activo");
  document.getElementById("overlay").classList.add("activo");
}

function cerrarPanel(){
  document.getElementById("panelAdmin").classList.remove("activo");
  document.getElementById("overlay").classList.remove("activo");
}

function actualizarSelector(){
  medidorEl.innerHTML = "";
  for(let key in medidores){
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = medidores[key].nombre;
    medidorEl.appendChild(opt);
  }
}
actualizarSelector();

function calcular(){

  const med = medidores[medidorEl.value];
  if(!med) return;

  const total = (Number(minEl.value)||0)*60 + (Number(segEl.value)||0);

  document.getElementById("totalSegundos").textContent =
    "Total: " + total + " segundos";

  if(total<=0) return;

  const dm3_h = (3600*100)/total;
  const m3_h = dm3_h/1000;

  document.getElementById("consumo_dm3").textContent =
    dm3_h.toFixed(2)+" dm³/h";

  document.getElementById("consumo_m3").textContent =
    m3_h.toFixed(3)+" m³/h";
}

minEl.addEventListener("input", calcular);
segEl.addEventListener("input", calcular);
medidorEl.addEventListener("change", calcular);

function agregarMedidorDemo(){
  medidores["demo"]= {
    nombre:"Medidor Demo",
    tabla:[{caudal:1,error:0}]
  };
  localStorage.setItem("medidoresData",JSON.stringify(medidores));
  actualizarSelector();
}

function exportarBackup(){
  const blob = new Blob([JSON.stringify(medidores)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download="backup_medidores.json";
  a.click();
}

function importarBackup(){
  document.getElementById("archivoBackup").click();
}

document.getElementById("archivoBackup").addEventListener("change",function(e){
  const reader = new FileReader();
  reader.onload = function(ev){
    medidores = JSON.parse(ev.target.result);
    localStorage.setItem("medidoresData",JSON.stringify(medidores));
    actualizarSelector();
  }
  reader.readAsText(e.target.files[0]);
});

</script>
</body>
</html>
