<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consumo de medidor</title>

<link rel="icon" href="ecotermo.png">

<style>
*{ box-sizing:border-box; }

body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
  padding:40px 20px;
  margin:0;
  position:relative;
}

.menuBtn{
  position:absolute;
  top:20px;
  left:20px;
  background:none;
  border:none;
  color:white;
  font-size:28px;
  cursor:pointer;
}

.container{
  background:#1e293b;
  padding:35px;
  border-radius:20px;
  max-width:750px;
  margin:0 auto;
  box-shadow:0 12px 35px rgba(0,0,0,0.5);
}

.logoBox{
  background:white;
  padding:12px 20px;
  border-radius:14px;
  display:inline-block;
  margin-bottom:20px;
}

.logoBox img{ width:180px; }

select, input, button{
  padding:8px;
  border-radius:8px;
  margin:6px;
}

button{ cursor:pointer; }

.timeContainer{
  display:flex;
  max-width:520px;
  margin:20px auto;
  background:#0f172a;
  border-radius:14px;
  overflow:hidden;
}

.timeBox{ flex:1; padding:18px 12px; }
.divider{ width:2px; background:rgba(255,255,255,0.20); }

.totalSeg{
  margin-top:10px;
  font-size:14px;
  opacity:.85;
}

.result{
  margin-top:15px;
  font-size:22px;
  font-weight:bold;
}

.factor{
  margin-top:15px;
  font-size:22px;
  font-weight:bold;
  padding:10px;
  border-radius:12px;
  display:inline-block;
}

.factor.pos{ color:#22c55e; background:rgba(34,197,94,.12); }
.factor.neg{ color:#ef4444; background:rgba(239,68,68,.12); }
.factor.neu{ color:#e5e7eb; }

.overlay{
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:900;
}
.overlay.activo{ display:block; }

.panelAdmin{
  position:fixed;
  top:0;
  left:-400px;
  width:350px;
  height:100%;
  background:#111827;
  box-shadow:5px 0 20px rgba(0,0,0,0.5);
  transition:left 0.3s ease;
  z-index:1000;
  padding:20px;
  overflow-y:auto;
}
.panelAdmin.activo{ left:0; }

.medItem{
  background:#1f2937;
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.iconoAccion{
  cursor:pointer;
  font-size:20px;
}

.menuAcciones{
  margin-top:8px;
  display:none;
}

.menuAcciones button{
  background:none;
  border:none;
  color:white;
  font-size:18px;
  cursor:pointer;
  margin-right:10px;
}

@media (max-width:600px){
  .panelAdmin{
    width:100%;
    left:-100%;
  }
  .panelAdmin.activo{
    left:0;
  }
}
</style>
</head>

<body>

<button class="menuBtn" onclick="abrirPanel()">☰</button>

<div class="container">
  <div class="logoBox">
    <img src="ecotermo.png">
  </div>

  <h1>Consumo de medidor</h1>

  <select id="medidor"></select>

  <p>Tiempo que tarda en consumir <b>100 dm³</b></p>

  <div class="timeContainer">
    <div class="timeBox">
      Minutos<br>
      <input type="number" id="minutos" min="0">
    </div>
    <div class="divider"></div>
    <div class="timeBox">
      Segundos<br>
      <input type="number" id="segundos" min="0">
    </div>
  </div>

  <div class="totalSeg" id="totalSegundos">Total: — segundos</div>
  <div class="result" id="consumo_dm3">— dm³/h</div>
  <div class="result" id="consumo_m3">— m³/h</div>
  <div class="factor neu" id="factor">Factor de corrección: —</div>
  <div id="tablaUsada"></div>
</div>

<div id="overlay" class="overlay" onclick="cerrarPanel()"></div>

<div id="panelAdmin" class="panelAdmin">

  <button onclick="pedirPassword()">⚙ Configuración</button>
  <hr>

  <div id="zonaConfig" style="display:none;">

    <button onclick="exportarDatos()">📤 Exportar datos</button>
    <button onclick="document.getElementById('importFile').click()">📥 Importar datos</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importarDatos(event)">

    <hr>
  </div>

  <h3>Administrar medidores</h3>

  <div id="listaMedidores"></div>

  <hr>

  <button id="btnAgregar" onclick="mostrarFormularioNuevo()" style="display:none;">
    ➕ Agregar medidor
  </button>

  <div id="formularioMedidor" style="display:none; margin-top:20px;">
    <h4>Agregar / Editar medidor</h4>
    <input type="text" id="nuevoNombre" placeholder="Nombre del medidor">
    <input type="text" id="nuevoInstrumento" placeholder="N° de instrumento">

    <select id="nuevaUnidad">
      <option value="dm3">Trabaja en dm³/h</option>
      <option value="m3">Trabaja en m³/h</option>
    </select>

    <input type="file" id="archivoTabla" accept=".csv">

    <button onclick="guardarMedidor()">Guardar</button>
    <button onclick="cerrarFormulario()">Cancelar</button>
  </div>

  <br>
  <button onclick="cerrarPanel()">Cerrar</button>

</div>

<script>

let medidores = JSON.parse(localStorage.getItem("medidoresData")) || {};
let editandoClave = null;
let adminAutorizado = false;

const medidorEl = document.getElementById("medidor");
const minEl = document.getElementById("minutos");
const segEl = document.getElementById("segundos");
const btnAgregar = document.getElementById("btnAgregar");
const zonaConfig = document.getElementById("zonaConfig");

function actualizarSelector(){
  medidorEl.innerHTML = "";
  for(let key in medidores){
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = medidores[key].nombre;
    medidorEl.appendChild(opt);
  }
}
actualizarSelector();

function pedirPassword(){
  const pass = prompt("Ingrese contraseña:");
  if(pass === "final"){
    adminAutorizado = true;
    btnAgregar.style.display = "block";
    zonaConfig.style.display = "block";
    alert("Modo configuración activado");
    actualizarLista();
  }else{
    alert("Contraseña incorrecta");
  }
}

function exportarDatos(){
  const dataStr = JSON.stringify(medidores, null, 2);
  const blob = new Blob([dataStr], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "backup_medidores.json";
  a.click();
  URL.revokeObjectURL(url);
}

function importarDatos(event){
  const file = event.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const datos = JSON.parse(e.target.result);
      medidores = datos;
      localStorage.setItem("medidoresData", JSON.stringify(medidores));
      actualizarSelector();
      actualizarLista();
      alert("Datos importados correctamente");
    }catch(err){
      alert("Archivo inválido");
    }
  };
  reader.readAsText(file);
}

function abrirPanel(){
  document.getElementById("panelAdmin").classList.add("activo");
  document.getElementById("overlay").classList.add("activo");
  actualizarLista();
}

function cerrarPanel(){
  document.getElementById("panelAdmin").classList.remove("activo");
  document.getElementById("overlay").classList.remove("activo");
}

function actualizarLista(){
  const cont = document.getElementById("listaMedidores");
  cont.innerHTML = "";

  for(let key in medidores){
    const med = medidores[key];
    const div = document.createElement("div");
    div.className = "medItem";

    let acciones = "";
    if(adminAutorizado){
      acciones = `
        <div>
          <div class="menuAcciones" id="menu_${key}">
            <button onclick="editarMedidor('${key}')">✏️</button>
            <button onclick="eliminarMedidor('${key}')">🗑️</button>
          </div>
        </div>
        <div class="iconoAccion" onclick="toggleMenu('${key}')">⋮</div>
      `;
    }

    div.innerHTML = `
      <div>
        <strong>${med.nombre}</strong><br>
        Instrumento: ${med.instrumento}
      </div>
      ${acciones}
    `;
    cont.appendChild(div);
  }
}

function toggleMenu(clave){
  const menu = document.getElementById("menu_"+clave);
  if(menu){
    menu.style.display = (menu.style.display === "block") ? "none" : "block";
  }
}

function mostrarFormularioNuevo(){
  if(!adminAutorizado) return;
  editandoClave = null;
  document.getElementById("formularioMedidor").style.display = "block";
}

function cerrarFormulario(){
  document.getElementById("formularioMedidor").style.display = "none";
}

function editarMedidor(clave){
  if(!adminAutorizado) return;
  editandoClave = clave;
  const med = medidores[clave];
  document.getElementById("formularioMedidor").style.display = "block";
  document.getElementById("nuevoNombre").value = med.nombre;
  document.getElementById("nuevoInstrumento").value = med.instrumento;
  document.getElementById("nuevaUnidad").value = med.unidad;
}

function guardarMedidor(){

  if(!adminAutorizado) return;

  const nombre = document.getElementById("nuevoNombre").value.trim();
  const instrumento = document.getElementById("nuevoInstrumento").value.trim();
  const unidad = document.getElementById("nuevaUnidad").value;
  const archivo = document.getElementById("archivoTabla").files[0];

  if(!nombre) return alert("Nombre requerido");

  let tabla = editandoClave ? medidores[editandoClave].tabla : [];

  if(archivo){
    const reader = new FileReader();
    reader.onload = function(e){
      const texto = e.target.result;
      const lineas = texto.split("\n").slice(1);
      tabla = [];

      lineas.forEach(linea=>{
        if(!linea.trim()) return;
        let separador = linea.includes(";") ? ";" : ",";
        let partes = linea.split(separador);
        if(partes.length < 2) return;

        let caudal = parseFloat(partes[0].trim().replace(",", "."));
        let error  = parseFloat(partes[1].trim().replace(",", "."));

        if(!isNaN(caudal) && !isNaN(error)){
          tabla.push({caudal,error});
        }
      });

      finalizarGuardado(nombre,instrumento,unidad,tabla);
    };
    reader.readAsText(archivo);
  }else{
    finalizarGuardado(nombre,instrumento,unidad,tabla);
  }
}

function finalizarGuardado(nombre,instrumento,unidad,tabla){
  const clave = editandoClave || "med_"+Date.now();
  medidores[clave] = {nombre,instrumento,unidad,tabla};
  localStorage.setItem("medidoresData", JSON.stringify(medidores));
  cerrarFormulario();
  actualizarSelector();
  actualizarLista();
}

function eliminarMedidor(clave){
  if(!adminAutorizado) return;
  if(!confirm("¿Eliminar medidor?")) return;
  delete medidores[clave];
  localStorage.setItem("medidoresData", JSON.stringify(medidores));
  actualizarSelector();
  actualizarLista();
}

minEl.addEventListener("input", calcular);
segEl.addEventListener("input", calcular);
medidorEl.addEventListener("change", calcular);

function calcular(){
  const medidor = medidores[medidorEl.value];
  if(!medidor || !medidor.tabla || medidor.tabla.length === 0) return;

  let min = Number(minEl.value) || 0;
  let seg = Number(segEl.value) || 0;

  if(seg >= 60){
    min += Math.floor(seg / 60);
    seg = seg % 60;
  }

  const total = (min * 60) + seg;
  document.getElementById("totalSegundos").textContent =
    "Total: " + total.toLocaleString("es-AR") + " segundos";

  if(total <= 0) return;

  const dm3_h = (3600 * 100) / total;
  const m3_h  = dm3_h / 1000;

  document.getElementById("consumo_dm3").textContent =
    dm3_h.toLocaleString("es-AR",{maximumFractionDigits:2}) + " dm³/h";

  document.getElementById("consumo_m3").textContent =
    m3_h.toLocaleString("es-AR",{maximumFractionDigits:4}) + " m³/h";

  const tabla = medidor.tabla;
  const valorComparacion = medidor.unidad === "dm3" ? dm3_h : m3_h;

  let masCercano = tabla[0];
  let difMin = Math.abs(valorComparacion - masCercano.caudal);

  for(let i=1; i<tabla.length; i++){
    const dif = Math.abs(valorComparacion - tabla[i].caudal);
    if(dif < difMin){
      difMin = dif;
      masCercano = tabla[i];
    }
  }

  const err = masCercano.error;
  const factorEl = document.getElementById("factor");

  factorEl.className = (err < 0) ? "factor neg" : "factor pos";
  factorEl.textContent =
    "Factor de corrección: " +
    err.toLocaleString("es-AR",{minimumFractionDigits:2}) + " %";

  document.getElementById("tablaUsada").textContent =
    "Tabla usada: " + masCercano.caudal +
    (medidor.unidad === "dm3" ? " dm³/h" : " m³/h");
}

calcular();

</script>
</body>
</html>
