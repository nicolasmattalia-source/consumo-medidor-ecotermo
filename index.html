<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consumo de medidor</title>

<style>
*{ box-sizing:border-box; }

body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
  padding:40px 20px;
  margin:0;
}

.menuBtn{
  position:absolute;
  top:20px;
  left:20px;
  background:none;
  border:none;
  color:white;
  font-size:28px;
  cursor:pointer;
}

.container{
  background:#1e293b;
  padding:35px;
  border-radius:20px;
  max-width:750px;
  margin:0 auto;
}

select, input, button{
  padding:8px;
  border-radius:8px;
  margin:6px;
}

.panelAdmin{
  position:fixed;
  top:0;
  left:-420px;
  width:380px;
  height:100%;
  background:#111827;
  transition:left .3s ease;
  padding:20px;
  overflow-y:auto;
}

.panelAdmin.activo{ left:0; }

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
}

.overlay.activo{ display:block; }

.factor.pos{ color:#22c55e; }
.factor.neg{ color:#ef4444; }

</style>
</head>

<body>

<button class="menuBtn" onclick="abrirPanel()">☰</button>

<div class="container">

<h1>Consumo de medidor</h1>

<select id="medidor"></select>

<p>Tiempo que tarda en consumir <b>100 dm³</b></p>

<input type="number" id="minutos" placeholder="Minutos">
<input type="number" id="segundos" placeholder="Segundos">

<div id="consumo_dm3"></div>
<div id="consumo_m3"></div>
<div id="factor"></div>

</div>

<div id="overlay" class="overlay" onclick="cerrarPanel()"></div>

<div id="panelAdmin" class="panelAdmin">

<h3>Administrar medidores</h3>

<button onclick="exportarBackup()">Exportar Backup</button>
<button onclick="importarBackup()">Importar Backup</button>
<input type="file" id="archivoBackup" accept=".json" style="display:none">

<hr>

<input type="text" id="nuevoNombre" placeholder="Nombre">
<select id="nuevaUnidad">
<option value="dm3">dm3/h</option>
<option value="m3">m3/h</option>
</select>
<input type="file" id="archivoTabla" accept=".csv">
<button onclick="guardarMedidor()">Guardar</button>

</div>

<script>

let medidores = JSON.parse(localStorage.getItem("medidoresData") || "{}");

const medidorEl = document.getElementById("medidor");

function abrirPanel(){
  document.getElementById("panelAdmin").classList.add("activo");
  document.getElementById("overlay").classList.add("activo");
}

function cerrarPanel(){
  document.getElementById("panelAdmin").classList.remove("activo");
  document.getElementById("overlay").classList.remove("activo");
}

function actualizarSelector(){
  medidorEl.innerHTML="";
  const keys = Object.keys(medidores);

  if(keys.length===0){
    const opt=document.createElement("option");
    opt.textContent="No hay medidores cargados";
    medidorEl.appendChild(opt);
    return;
  }

  keys.forEach(k=>{
    const opt=document.createElement("option");
    opt.value=k;
    opt.textContent=medidores[k].nombre;
    medidorEl.appendChild(opt);
  });
}

function parseNumero(v){
  if(!v) return 0;
  return parseFloat(v.replace(",","."));
}

function guardarMedidor(){

  const nombre=document.getElementById("nuevoNombre").value;
  const unidad=document.getElementById("nuevaUnidad").value;
  const archivo=document.getElementById("archivoTabla").files[0];

  if(!archivo){ alert("Seleccione CSV"); return; }

  const reader=new FileReader();

  reader.onload=function(e){

    const lineas=e.target.result.split(/\r?\n/);
    const tabla=[];

    for(let i=1;i<lineas.length;i++){
      if(!lineas[i]) continue;

      let cols=lineas[i].includes(";")
        ? lineas[i].split(";")
        : lineas[i].split(",");

      tabla.push({
        caudal:parseNumero(cols[0]),
        error:parseNumero(cols[1])
      });
    }

    const id=Date.now().toString();

    medidores[id]={nombre,unidad,tabla};

    localStorage.setItem("medidoresData",JSON.stringify(medidores));

    actualizarSelector();
    cerrarPanel();
  };

  reader.readAsText(archivo);
}

function exportarBackup(){
  const blob=new Blob([JSON.stringify(medidores,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="backup.json";
  a.click();
}

function importarBackup(){
  document.getElementById("archivoBackup").click();
}

document.getElementById("archivoBackup").addEventListener("change",function(e){
  const file=e.target.files[0];
  if(!file) return;

  const reader=new FileReader();

  reader.onload=function(ev){
    medidores=JSON.parse(ev.target.result);
    localStorage.setItem("medidoresData",JSON.stringify(medidores));
    actualizarSelector();
  };

  reader.readAsText(file);
});

actualizarSelector();

</script>
</body>
</html>
