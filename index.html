<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consumo de medidor</title>

<link rel="icon" href="ecotermo.png">

<style>
*{ box-sizing:border-box; }

body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
  padding:40px 20px;
  margin:0;
}

.menuBtn{
  position:absolute;
  top:20px;
  left:20px;
  background:none;
  border:none;
  color:white;
  font-size:28px;
  cursor:pointer;
  z-index:1100;
}

.container{
  background:#1e293b;
  padding:35px;
  border-radius:20px;
  max-width:750px;
  margin:0 auto;
  box-shadow:0 12px 35px rgba(0,0,0,0.5);
}

.logoBox{
  background:white;
  padding:12px 20px;
  border-radius:14px;
  display:inline-block;
  margin-bottom:20px;
}

.logoBox img{ width:180px; }

select, input, button{
  padding:8px;
  border-radius:8px;
  margin:6px;
}

.timeContainer{
  display:flex;
  justify-content:center;
  gap:20px;
  margin:20px 0;
}

.timeBox{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.result{
  margin-top:10px;
  font-size:20px;
  font-weight:bold;
}

#factor{
  margin-top:10px;
  font-size:18px;
  font-weight:bold;
}

.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:998;
}
.overlay.activo{ display:block; }

.panelAdmin{
  position:fixed;
  top:0;
  left:-320px;
  width:300px;
  height:100%;
  background:#111827;
  box-shadow:5px 0 20px rgba(0,0,0,0.5);
  transition:left 0.3s ease;
  z-index:999;
  padding:20px;
  overflow-y:auto;
}
.panelAdmin.activo{ left:0; }

.medItem{
  background:#1f2937;
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.iconoAccion{
  cursor:pointer;
  margin-left:8px;
}

/* ============================= */
/* ======== RESPONSIVE ========= */
/* ============================= */
@media (max-width: 768px){

  body{
    padding:20px 10px;
  }

  .container{
    padding:20px;
    border-radius:18px;
  }

  h1{
    font-size:26px;
  }

  .logoBox img{
    width:140px;
  }

  select, input{
    width:100%;
  }

  .timeContainer{
    flex-direction:column;
    gap:12px;
  }

  .timeBox{
    width:100%;
  }

  .result{
    font-size:18px;
  }

}

@media (max-height: 500px){

  body{
    padding:15px;
  }

  .container{
    padding:18px;
  }

  h1{
    font-size:22px;
  }

  .logoBox img{
    width:120px;
  }

  .timeContainer{
    flex-direction:row;
    gap:15px;
  }

  .timeBox{
    flex:1;
  }

}  
}
</style>
</head>

<body>

<button class="menuBtn" onclick="abrirPanel()">☰</button>

<div class="container">

  <div class="logoBox">
    <img src="ecotermo.png">
  </div>

  <h1>Consumo de medidor</h1>

  <select id="medidor"></select>

  <p>Tiempo que tarda en consumir <b>100 dm³</b></p>

  <div class="timeContainer">
    <div class="timeBox">
      <label>Minutos</label>
      <input type="number" id="minutos" min="0">
    </div>
    <div class="timeBox">
      <label>Segundos</label>
      <input type="number" id="segundos" min="0">
    </div>
  </div>

  <div id="totalSegundos">Total: — segundos</div>
  <div class="result" id="consumo_dm3">— dm³/h</div>
  <div class="result" id="consumo_m3">— m³/h</div>
  <div id="factor">Factor de corrección: —</div>
<div class="result" id="energia_kcal">
  Potencia estimada: — kcal/h
</div>
</div>

<div id="overlay" class="overlay" onclick="cerrarPanel()"></div>

<div id="panelAdmin" class="panelAdmin">

  <button onclick="pedirPassword()">⚙ Configuración</button>
  <hr>

  <div id="zonaConfig" style="display:none;">

    <button onclick="mostrarFormulario()">➕ Agregar medidor</button>

    <div id="formMedidor" style="display:none;">
      <input type="text" id="nuevoNombre" placeholder="Nombre">
      <input type="text" id="nuevoInstrumento" placeholder="Instrumento">
      <select id="nuevaUnidad">
        <option value="dm3">dm³/h</option>
        <option value="m3">m³/h</option>
      </select>
      <input type="file" id="archivoTabla" accept=".csv">
      <button onclick="guardarMedidor()">Guardar</button>
    </div>

  </div>

  <hr>

  <div id="listaMedidores"></div>

  <br>
  <button onclick="cerrarPanel()">Cerrar</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

document.addEventListener("DOMContentLoaded", () => {

const firebaseConfig = {
  apiKey: "AIzaSyDr1J5UGwJfFNG0A5Ip3verQOXtnqA6i10",
  authDomain: "ecotermo-medidor.firebaseapp.com",
  projectId: "ecotermo-medidor"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colRef = collection(db, "medidores");
  const configRef = doc(db, "configuracion", "general");
let poderCalorifico = null;

let medidores = {};
let adminAutorizado = false;
let editandoClave = null;

const medidorEl = document.getElementById("medidor");
const minEl = document.getElementById("minutos");
const segEl = document.getElementById("segundos");
const factorEl = document.getElementById("factor");

onSnapshot(colRef, (snapshot)=>{
  medidores = {};
  snapshot.forEach(docSnap=>{
    medidores[docSnap.id] = docSnap.data();
  });
  actualizarSelector();
  actualizarLista();
});

window.abrirPanel = function(){
  panelAdmin.classList.add("activo");
  overlay.classList.add("activo");
}

window.cerrarPanel = function(){
  panelAdmin.classList.remove("activo");
  overlay.classList.remove("activo");
}

window.pedirPassword = function(){
  if(prompt("Ingrese contraseña:") === "final"){
    adminAutorizado = true;
    zonaConfig.style.display = "block";
    actualizarLista();
  }
}

function actualizarSelector(){
  medidorEl.innerHTML="";
  Object.keys(medidores).forEach(key=>{
    const opt=document.createElement("option");
    opt.value=key;
    opt.textContent=medidores[key].nombre;
    medidorEl.appendChild(opt);
  });
}

function actualizarLista(){
  listaMedidores.innerHTML="";
  Object.keys(medidores).forEach(key=>{
    const med=medidores[key];
    const div=document.createElement("div");
    div.className="medItem";
    div.innerHTML=`
      <div>${med.nombre}</div>
      ${adminAutorizado ? `
        <div>
          <span class="iconoAccion" onclick="editarMedidor('${key}')">✏</span>
          <span class="iconoAccion" onclick="eliminarMedidor('${key}')">🗑</span>
        </div>
      ` : ""}
    `;
    listaMedidores.appendChild(div);
  });
}

window.mostrarFormulario = function(){
  editandoClave=null;
  nuevoNombre.value="";
  nuevoInstrumento.value="";
  archivoTabla.value="";
  formMedidor.style.display="block";
}

window.editarMedidor = function(clave){
  editandoClave=clave;
  const med=medidores[clave];
  nuevoNombre.value=med.nombre;
  nuevoInstrumento.value=med.instrumento;
  nuevaUnidad.value=med.unidad;
  archivoTabla.value="";
  formMedidor.style.display="block";
}

window.guardarMedidor = async function(){

  const nombre=nuevoNombre.value.trim();
  const instrumento=nuevoInstrumento.value.trim();
  const unidad=nuevaUnidad.value;
  const archivo=archivoTabla.files[0];

  if(!nombre) return;

  let tabla = medidores[editandoClave]?.tabla || [];

  if(archivo){
    const texto = await archivo.text();
    const lineas = texto.split("\n").slice(1);
    tabla = [];

    lineas.forEach(linea=>{
      if(!linea.trim()) return;
      const partes=linea.includes(";")?linea.split(";"):linea.split(",");
      const caudal=parseFloat(partes[0].replace(",","."));
      const error=parseFloat(partes[1].replace(",","."));
      if(!isNaN(caudal)&&!isNaN(error)){
        tabla.push({caudal,error});
      }
    });
  }

  const clave = editandoClave || "med_"+Date.now();

  await setDoc(doc(db,"medidores",clave),{
    nombre,instrumento,unidad,tabla
  });

  editandoClave=null;
  formMedidor.style.display="none";
}

window.eliminarMedidor = async function(clave){
  await deleteDoc(doc(db,"medidores",clave));
}

/* ===== CÁLCULO ===== */

function calcular(){

  let min=Number(minEl.value)||0;
  let seg=Number(segEl.value)||0;

  if(seg>=60){ min+=Math.floor(seg/60); seg%=60; }

  const total=(min*60)+seg;
  totalSegundos.textContent="Total: "+total+" segundos";
  if(total<=0) return;

  const dm3_h=(3600*100)/total;
  const m3_h=dm3_h/1000;

  consumo_dm3.textContent=dm3_h.toFixed(2)+" dm³/h";
  consumo_m3.textContent=m3_h.toFixed(4)+" m³/h";

  const med=medidores[medidorEl.value];
  if(!med || !med.tabla || med.tabla.length===0){
    factorEl.textContent="Factor de corrección: —";
    factorEl.style.color="white";
    return;
  }

  const valor = med.unidad==="dm3"?dm3_h:m3_h;

  let masCercano=med.tabla[0];
  let difMin=Math.abs(valor-masCercano.caudal);

  for(let i=1;i<med.tabla.length;i++){
    const dif=Math.abs(valor-med.tabla[i].caudal);
    if(dif<difMin){ difMin=dif; masCercano=med.tabla[i]; }
  }

  factorEl.textContent="Factor de corrección: "+masCercano.error.toFixed(2)+" %";
  factorEl.style.color = masCercano.error>=0 ? "#22c55e" : "#ef4444";
}

minEl.addEventListener("input",calcular);
segEl.addEventListener("input",calcular);
medidorEl.addEventListener("change",calcular);

});
</script>
</body>
</html>
